# webmouse configuration
#
# Search order: --config PATH, $PADLINK_CONFIG, ./webmouse.toml, then the user
# config directory (run `webmouse --init-config` to create one there).
# Precedence: built-in defaults < this file < PADLINK_* environment < command line.

[server]
# Address to listen on. "0.0.0.0" = all IPv4 interfaces (reachable from your
# LAN). Use "::" for IPv6 too, or a specific LAN address to be stricter.
host = "0.0.0.0"
port = 8765
# Override the URL printed/encoded in the QR code. Needed with Docker bridge
# networking or when your PC has several network interfaces.
public_url = ""
# Extra Host header names accepted besides IP addresses, localhost, this
# machine's hostname and *.local (protects against DNS rebinding).
allowed_hosts = []

[security]
# "auto" generates a fresh random PIN on every start. Or set your own
# (at least 4 characters). Can also be set with PADLINK_PIN.
pin = "auto"
pin_length = 6
# Only private/LAN addresses (10/8, 172.16/12, 192.168/16, link-local, loopback,
# fc00::/7) may connect. Add more CIDR ranges here, e.g. a Tailscale network:
# allowed_networks = ["100.64.0.0/10"]
allowed_networks = []
# After this many wrong PINs a client IP is locked out. The lockout doubles
# each time it is triggered again.
max_failed_attempts = 3
lockout_seconds = 60
# How long a paired device stays signed in.
session_hours = 6
# Maximum number of paired devices at once (the least recently used is dropped).
max_devices = 2
# Embed the PIN in the QR code so scanning it signs you in directly.
qr_includes_pin = true

[tls]
# Serve over HTTPS using a self-signed certificate (needs: pip install "webmouse[tls]").
# Your browser will show a one-time warning. Required for some browser features
# such as keeping the screen awake, on non-localhost origins.
enabled = false
# Leave empty to auto-generate and store a certificate in the user config dir.
cert_file = ""
key_file = ""

[input]
# "auto", "pynput" (Windows, macOS, X11), "uinput" (Linux incl. Wayland), "dummy"
backend = "auto"
# Finger travel in pixels that equals one scroll notch at scroll speed 1.0.
scroll_px_per_tick = 28.0
# Pinch distance in pixels that equals one zoom notch.
zoom_px_per_tick = 30.0
max_text_length = 2000

[stream]
# Screen mirroring in the touchpad. Needs an X11, Windows or macOS desktop
# (not available on Wayland). Capturing only runs while a device is watching.
enabled = true
# Upper limits; each device can pick lower values in its settings.
fps = 10
quality = 30
scale = 0.5
draw_cursor = true

[ui]
# Defaults for new devices. Each device can change them in Settings.
theme = "system"            # "system", "light" or "dark"
mode = "relative"           # "relative" or "absolute"
sensitivity = 1.0
acceleration = 0.5
scroll_speed = 1.0
natural_scroll = true
tap_to_click = true
pen_mode = "direct"         # "direct" (absolute, pen down = click) or "touchpad"
show_buttons = true
haptics = true
keep_awake = true
