[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "webmouse"
dynamic = ["version"]
description = "Use your phone or tablet as a wireless touchpad, stylus pad and keyboard for your computer. LAN only, PIN protected."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["remote mouse", "touchpad", "remote keyboard", "lan", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "aiohttp>=3.9",
    "mss>=9.0",
    "Pillow>=9.5",
    "pynput>=1.7.6",
    "qrcode>=7.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tls = ["cryptography>=41"]
dev = ["pytest>=7"]

[project.scripts]
webmouse = "webmouse.cli:main"

[tool.hatch.version]
path = "src/webmouse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/webmouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
